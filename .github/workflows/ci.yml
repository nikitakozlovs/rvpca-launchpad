name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lapai pašai atkarību nav — šīs ir tikai testiem.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  no-external-requests:
    name: Bez ārējiem pieprasījumiem
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ātrā, statiskā pārbaude. Playwright tests to pašu pārbauda izpildes
      # laikā; šī noķer atsauci jau kodā, pat ja tā vēl nav ielādēta.
      - run: node tools/check-external-refs.mjs
