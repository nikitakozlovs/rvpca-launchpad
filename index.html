<!DOCTYPE html>
<html lang="lv" data-theme="sintakse">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rīgas darbvirsma</title>
<meta name="description" content="Rīgas valstspilsētas pašvaldības iekšējo lietotņu darbvirsma.">
<link rel="icon" href="brand/assets/riga-keys.svg" type="image/svg+xml">

<!-- Load order is mandated by the Sintakse design system (see brand/styles.css):
     daisyUI stylesheet → Tailwind browser build → brand tokens → icons → page CSS. -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="brand/styles.css">
<link rel="stylesheet" href="brand/fonts/fontawesome/css/fontawesome.css">
<link rel="stylesheet" href="brand/fonts/fontawesome/css/light.css">
<link rel="stylesheet" href="launchpad.css">

<!-- Restore the saved theme before first paint so dark users get no light flash. -->
<script>
  try {
    if (localStorage.getItem('rvpca-theme') === 'dark') {
      document.documentElement.dataset.theme = 'sintakse-dark';
      document.documentElement.classList.add('dark');
    }
  } catch (e) { /* private mode — stay on the default light theme */ }
</script>
</head>
<body>

<a class="skip-link" href="#board">Pāriet uz saturu</a>

<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <a class="wordmark" href="./" aria-label="Rīgas darbvirsma — sākums">
      <span class="wordmark__mark" aria-hidden="true"></span>
      <span class="wordmark__text">Rīgas darbvirsma</span>
    </a>

    <div class="topbar__tools">
      <div class="filter">
        <i class="fa-light fa-magnifying-glass filter__icon" aria-hidden="true"></i>
        <input
          type="search"
          id="filter"
          class="filter__input"
          placeholder="Meklēt lietotni"
          aria-label="Meklēt lietotni"
          autocomplete="off"
          spellcheck="false">
        <kbd class="filter__hint" aria-hidden="true">/</kbd>
      </div>

      <button type="button" id="theme-toggle" class="icon-button" aria-pressed="false">
        <i class="fa-light fa-moon" aria-hidden="true"></i>
        <span class="sr-only">Pārslēgt tumšo režīmu</span>
      </button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page__head">
    <div class="page__texture" aria-hidden="true"></div>
    <h1 class="page__title" id="page-title">Rīgas darbvirsma</h1>
    <p class="page__lead" id="page-lead">Rīgas valstspilsētas pašvaldības iekšējās lietotnes.</p>
  </div>

  <div id="board" class="board" tabindex="-1"></div>

  <p id="empty" class="empty" hidden>Nav atrasta neviena lietotne.</p>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main>

<script src="config/apps.js"></script>
<script src="app.js"></script>
</body>
</html>
